<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title><h1>Sign in</h1></mat-card-title>
    <mat-card-subtitle>Access your projects and tasks</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    @if (errorMessage(); as message) {
      <p class="form-error" role="alert">{{ message }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.invalid) {
          <mat-error>{{ error('email') }}</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input
          matInput
          [type]="hidePassword() ? 'password' : 'text'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          [attr.aria-label]="hidePassword() ? 'Show password' : 'Hide password'"
          (click)="hidePassword.set(!hidePassword())"
        >
          <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
        @if (form.controls.password.invalid) {
          <mat-error>{{ error('password') }}</mat-error>
        }
      </mat-form-field>

      <button mat-flat-button type="submit" class="submit" [disabled]="submitting()">
        @if (submitting()) {
          <mat-spinner diameter="20" aria-label="Signing in" />
        } @else {
          Sign in
        }
      </button>
    </form>
  </mat-card-content>

  <mat-card-footer>
    <p class="switch">No account yet? <a routerLink="/register">Create an account</a></p>
  </mat-card-footer>
</mat-card>
